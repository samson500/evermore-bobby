<!DOCTYPE html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183D8E" />
    <title>Create Account | Evermore</title>
    <meta name="description" content="Create your Evermore account and start contributing to AI model training." />
    <link rel="icon" href="favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <div class="site-wrapper">
      <div class="site-main" role="main">
        <div class="inner">
          <div class="gvScreen active" id="registerScreen">
            <header class="gvHeader">
              <a class="gvLogo" href="index.html">
                <img src="logo-with-text.svg" alt="Evermore" />
              </a>
              <a class="gvSigninBtn" href="login.html">Sign In</a>
            </header>

            <section class="gvHero">
              <p class="gvEyebrow">Evermore Platform</p>
              <h1>Create your account</h1>
              <p>Join the AI training hub for Africa — contribute to real model training and get rewarded.</p>
            </section>

            <section class="gvFormCard">
              <h2 class="gvFormTitle">Get started</h2>
              <div class="gvError" id="gvSignupError"></div>
              <form id="gvSignupForm" novalidate>
                <div class="field">
                  <label for="fullName">Full name</label>
                  <input id="fullName" name="fullName" type="text" placeholder="e.g. Ada Obi" autocomplete="name" required />
                </div>
                <div class="field">
                  <label for="username">Username</label>
                  <input id="username" name="username" type="text" placeholder="e.g. ada_obi" autocomplete="username" required />
                </div>
                <div class="field">
                  <label for="email">Email address</label>
                  <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
                </div>
                <div class="field">
                  <label for="phone">Phone number</label>
                  <input id="phone" name="phone" type="tel" placeholder="e.g. 08123456789" autocomplete="tel" required />
                </div>
                <div class="field">
                  <label for="password">Password</label>
                  <div class="gvPasswordWrap">
                    <input id="password" name="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" required />
                    <button type="button" class="gvTogglePassword" id="gvTogglePassword" aria-label="Toggle password visibility">Show</button>
                  </div>
                </div>
                <button type="submit" class="gvSubmitBtn" id="gvSignupBtn">
                  <span class="gvSubmitSpinner"></span>
                  <span class="gvSubmitLabel">Create Account</span>
                </button>
              </form>
              <p class="gvFormFooter">
                Already have an account?
                <a href="login.html">Sign in</a>
              </p>
            </section>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/app.js?v=2"></script>
    <script>
      (function () {
        var E = window.Evermore;
        var form = document.getElementById("gvSignupForm");
        var btn = document.getElementById("gvSignupBtn");
        var errorBox = document.getElementById("gvSignupError");
        var toggle = document.getElementById("gvTogglePassword");

        toggle.addEventListener("click", function () {
          var p = document.getElementById("password");
          var show = p.type === "password";
          p.type = show ? "text" : "password";
          toggle.textContent = show ? "Hide" : "Show";
        });

        function showError(msg) {
          errorBox.textContent = msg;
          errorBox.classList.add("show");
        }

        function clearError() {
          errorBox.textContent = "";
          errorBox.classList.remove("show");
        }

        function normalizePhone(v) {
          return String(v || "").replace(/[^\d]/g, "");
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          clearError();

          var fullName = document.getElementById("fullName").value.trim();
          var username = document.getElementById("username").value.trim().toLowerCase();
          var email = document.getElementById("email").value.trim().toLowerCase();
          var phone = normalizePhone(document.getElementById("phone").value);
          var password = document.getElementById("password").value;

          if (!fullName) return showError("Please enter your full name.");
          if (!/^[a-z0-9_.]{3,20}$/.test(username))
            return showError("Username must be 3-20 characters (letters, numbers, _ or .).");
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError("Please enter a valid email address.");
          if (phone.length < 10) return showError("Please enter a valid phone number.");
          if (password.length < 6) return showError("Password must be at least 6 characters.");

          var users = E.get(E.LS.users, []);
          if (users.some(function (u) { return u.phone === phone; }))
            return showError("An account with this phone number already exists. Try signing in.");
          if (users.some(function (u) { return u.username === username; }))
            return showError("This username is already taken.");

          var user = {
            fullName: fullName,
            username: username,
            email: email,
            phone: phone,
            password: password,
            joined: new Date().toLocaleDateString("en-NG", { day: "numeric", month: "short", year: "numeric" }),
          };

          users.push(user);
          E.set(E.LS.users, users);
          E.set(E.LS.current, user);
          E.set(E.LS.active, false);
          E.set(E.LS.balance, 0);
          E.set(E.LS.totalEarned, 0);

          btn.classList.add("loading");
          btn.disabled = true;

          setTimeout(function () {
            window.location.href = "dashboard.html";
          }, 800);
        });

        if (E.currentUser()) window.location.replace("dashboard.html");
      })();
    </script>
  </body>
</html>
