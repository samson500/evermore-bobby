<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-label="AI training workflows — neural pulse illustration">
  <style>
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 160px 120px; }
    .pulse2 { animation: pulse 2.4s ease-in-out 0.6s infinite; transform-origin: 160px 120px; }
    .pulse3 { animation: pulse 2.4s ease-in-out 1.2s infinite; transform-origin: 160px 120px; }
    .dot { animation: dotPulse 1.6s ease-in-out infinite; }
    .line { stroke-dasharray: 4 6; animation: dash 1.4s linear infinite; }
    @keyframes pulse { from { transform: scale(0.55); opacity: 0.85; } to { transform: scale(1.1); opacity: 0; } }
    @keyframes dotPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -20; } }
  </style>
  <rect width="320" height="240" rx="24" fill="#0A1A38"/>
  <circle class="pulse" cx="160" cy="120" r="56" stroke="#3DFA8C" stroke-width="2"/>
  <circle class="pulse2" cx="160" cy="120" r="56" stroke="#3FB47A" stroke-width="2"/>
  <circle class="pulse3" cx="160" cy="120" r="56" stroke="#183D8E" stroke-width="2"/>
  <circle cx="160" cy="120" r="34" fill="#183D8E"/>
  <circle cx="160" cy="120" r="34" stroke="#3DFA8C" stroke-width="2"/>
  <circle class="dot" cx="160" cy="120" r="5" fill="#3DFA8C"/>
  <circle class="dot" cx="104" cy="96" r="3.5" fill="#3DFA8C" style="animation-delay:.2s"/>
  <circle class="dot" cx="212" cy="92" r="3.5" fill="#3FB47A" style="animation-delay:.5s"/>
  <circle class="dot" cx="220" cy="150" r="3.5" fill="#3DFA8C" style="animation-delay:.8s"/>
  <circle class="dot" cx="104" cy="148" r="3.5" fill="#E0A857" style="animation-delay:1.1s"/>
  <path class="line" d="M130 108 Q145 95 160 120 T196 134" stroke="#3DFA8C" stroke-width="2"/>
  <circle cx="104" cy="96" r="9" fill="none" stroke="#3FB47A" stroke-width="1.5"/>
  <circle cx="212" cy="92" r="9" fill="none" stroke="#3DFA8C" stroke-width="1.5"/>
  <circle cx="220" cy="150" r="9" fill="none" stroke="#E0A857" stroke-width="1.5"/>
  <circle cx="104" cy="148" r="9" fill="none" stroke="#3DFA8C" stroke-width="1.5"/>
</svg>
