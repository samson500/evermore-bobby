<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-label="Pan-African contributor network illustration">
  <style>
    .ring { animation: ringPulse 2.6s ease-in-out infinite; transform-origin: center; }
    .ring2 { animation: ringPulse 2.6s ease-in-out .65s infinite; transform-origin: center; }
    .ring3 { animation: ringPulse 2.6s ease-in-out 1.3s infinite; transform-origin: center; }
    .node { animation: nodeBlink 1.8s ease-in-out infinite; }
    .node2 { animation: nodeBlink 1.8s ease-in-out .45s infinite; }
    .node3 { animation: nodeBlink 1.8s ease-in-out .9s infinite; }
    .node4 { animation: nodeBlink 1.8s ease-in-out 1.35s infinite; }
    .wire { stroke-dasharray: 3 5; animation: dash 1.6s linear infinite; }
    @keyframes ringPulse { from { transform: scale(.6); opacity: .8; } to { transform: scale(1.25); opacity: 0; } }
    @keyframes nodeBlink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -16; } }
  </style>
  <rect width="320" height="240" rx="24" fill="#0A1A38"/>
  <circle cx="160" cy="120" r="30" fill="#183D8E"/>
  <circle cx="160" cy="120" r="30" stroke="#3DFA8C" stroke-width="2"/>
  <circle class="ring" cx="160" cy="120" r="34" stroke="#3DFA8C" stroke-width="1.5"/>
  <circle class="ring2" cx="160" cy="120" r="34" stroke="#3FB47A" stroke-width="1.5"/>
  <circle class="ring3" cx="160" cy="120" r="34" stroke="#E0A857" stroke-width="1.5"/>
  <path d="M160 120 L78 52 M160 120 L250 70 M160 120 L244 172 M160 120 L84 178 M160 120 L130 190" stroke="#0D2246" stroke-width="2" stroke-linecap="round"/>
  <path class="wire" d="M78 52 Q120 84 160 120 T244 172" stroke="#3DFA8C" stroke-width="1.5" stroke-linecap="round"/>
  <circle class="node" cx="78" cy="52" r="7" fill="#3DFA8C"/>
  <circle class="node2" cx="250" cy="70" r="7" fill="#3FB47A"/>
  <circle class="node3" cx="244" cy="172" r="7" fill="#3DFA8C"/>
  <circle class="node4" cx="84" cy="178" r="7" fill="#E0A857"/>
  <circle class="node" cx="130" cy="190" r="5" fill="#3FB47A"/>
  <path d="M110 30 h8 M106 34 h14 M103 38 h20" stroke="#3DFA8C" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <path d="M30 204 q60 -10 120 0 t120 0" stroke="#0D2246" stroke-width="2" stroke-linecap="round"/>
</svg>
